name: Get Unity License

on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Unity Version & Generate ALF
        run: |
          # 1. استخراج رقم إصدار يونيتي الخاص بمشروعك تلقائياً
          UNITY_VER=$(grep "m_EditorVersion:" MoayadAR/ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "Target Unity Version: $UNITY_VER"

          # 2. تشغيل بيئة يونيتي عبر Docker لاستخراج ملف التفعيل
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -w /project \
            unityci/editor:ubuntu-${UNITY_VER}-base-3 \
            unity-editor -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true

          # 3. نقل الملف إلى المجلد الرئيسي
          find . -name "*.alf" -exec mv {} . \;

      - name: Upload ALF File
        uses: actions/upload-artifact@v4
        with:
          name: ManualActivationFile
          path: ./*.alf
