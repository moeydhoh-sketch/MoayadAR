name: ci

# Safe CI: everything here runs WITHOUT a Unity license and WITHOUT secrets.
# Unity-dependent builds are intentionally not part of this workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build platform-agnostic core
        run: dotnet build tests-net/MoayadAR.TestsNet.csproj -v minimal
      - name: Run core test suite
        run: dotnet tests-net/bin/Debug/net8.0/MoayadAR.TestsNet.dll

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid committed keystores / signing files
        run: |
          ! git ls-files | grep -E '\.keystore$|^keystore\.properties$|google-services\.json$|\.pem$' \
            && echo "no secrets in tree"
      - name: Localization key parity
        run: |
          python3 - <<'PY'
          import json, sys
          en = set(json.load(open("Assets/MoayadAR/Localization/Tables/en.json")))
          ar = set(json.load(open("Assets/MoayadAR/Localization/Tables/ar.json")))
          if en != ar:
              print("key mismatch:", en ^ ar); sys.exit(1)
          print(f"localization OK: {len(en)} keys")
          PY
