name: Get Unity License ALF
on: workflow_dispatch
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Project Version
        run: |
          mkdir -p ProjectSettings
          cp MoayadAR/ProjectSettings/ProjectVersion.txt ProjectSettings/ProjectVersion.txt || true

      - name: Request manual activation file
        uses: game-ci/unity-request-activation-file@v4

      - name: Upload ALF
        uses: actions/upload-artifact@v4
        with:
          name: ManualActivationFile
          path: ./*.alf
